<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f5f5f7" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="动一点健康行动中心，支持走路、体重记录与自定义组队挑战。" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>动一点 · 健康行动中心</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#today" aria-label="动一点首页">
          <span class="brand-mark">动</span>
          <span class="brand-copy"><b>动一点</b><small>HEALTH IN MOTION</small></span>
        </a>
        <div class="sidebar-label">我的健康</div>
        <nav class="desktop-nav" id="desktop-nav"></nav>
        <div class="sidebar-bottom">
          <div class="leader-card">
            <span class="leader-orb"></span>
            <b>测试版</b>
            <p>数据手动输入，微信健康接口已预留。</p>
          </div>
          <button class="profile-chip" type="button" data-route="profile">
            <span class="avatar" data-user-avatar>康</span>
            <span><b data-user-name>小康</b><small data-user-phone>我的健康空间</small></span>
            <span class="profile-arrow">›</span>
          </button>
        </div>
      </aside>

      <div class="app-content">
        <header class="mobile-top">
          <a class="mobile-brand" href="#today">
            <span class="brand-mark">动</span>
            <span><b>动一点</b><small>健康行动中心</small></span>
          </a>
          <button class="mobile-avatar" type="button" data-route="profile" aria-label="打开我的页面" data-user-avatar>康</button>
        </header>
        <main id="main" tabindex="-1"></main>
      </div>

      <nav class="mobile-nav" id="mobile-nav" aria-label="手机端主导航"></nav>
      <div id="modal-root"></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
